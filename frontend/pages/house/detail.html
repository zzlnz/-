<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>房源详情 - 房屋租赁管理系统</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <style>
    .detail-grid { display:grid; grid-template-columns: 1.2fr .8fr; gap:24px; }
    .panel { overflow:hidden; }
    .cover { width:100%; height:360px; object-fit:cover; display:block; }
    .body { padding: 20px; }
    .meta { color:var(--muted); margin:8px 0; line-height:1.7; }
    .price { color:var(--danger); font-size:28px; font-weight:800; margin:16px 0; }
    .desc { line-height:1.8; color:#374151; }
    .status-box { padding:14px 16px; border-radius:12px; margin-bottom:16px; line-height:1.7; }
    .status-available { background:#ecfdf5; color:#166534; }
    .status-rented { background:#fff7ed; color:#9a3412; }
    .status-alert { background:#eff6ff; color:#1d4ed8; }
    .form input, .form textarea { width:100%; margin-bottom:12px; padding:12px 14px; border:1px solid var(--border); border-radius:12px; background:#fff; }
    .form textarea { min-height:120px; resize:vertical; }
    .helper { color:var(--muted); font-size:13px; margin-top:-6px; margin-bottom:12px; line-height:1.6; }
    .lease-info { margin-top:12px; padding:14px 16px; border:1px dashed #cbd5e1; border-radius:12px; background:#f8fafc; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
    .btn:disabled { opacity:.55; cursor:not-allowed; }
    .small { font-size: 13px; color: var(--muted); }
    @media (max-width:900px){ .detail-grid{grid-template-columns:1fr;} .cover{height:260px;} }
  </style>
</head>
<body>
  <div class="app-topbar">
    <div class="app-brand"><a href="/pages/home/index.html">← 返回首页</a></div>
    <div class="app-user" id="userInfo"></div>
  </div>
  <div class="page-shell">
    <div id="content" class="detail-grid"></div>
  </div>
  <script>
    const id = new URLSearchParams(location.search).get('id');
    const content = document.getElementById('content');
    const currentUser = JSON.parse(localStorage.getItem('user') || '{}');
    document.getElementById('userInfo').textContent = currentUser.username ? `当前用户：${currentUser.real_name || currentUser.username}` : '游客模式';

    function formatDate(input) { if (!input) return '-'; const d = new Date(input); if (Number.isNaN(d.getTime())) return String(input).slice(0, 10); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function toDateInputValue(date) { const d = new Date(date); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
    function addDays(dateStr, days) { const d = new Date(dateStr); d.setDate(d.getDate() + days); return toDateInputValue(d); }

    async function loadDetail() {
      try {
        const res = await fetch('/api/houses/' + id);
        const result = await res.json();
        if (result.code !== 200) { content.innerHTML = `<div class="empty-state">${result.message || '加载失败'}</div>`; return; }
        const item = result.data;
        const currentLease = item.current_lease;
        const isRented = item.house_status === 'rented' || !!currentLease;
        const canApply = !!currentUser.id && !isRented;
        const leaseMsg = currentLease ? `该房源当前租期为 ${formatDate(currentLease.lease_start_date)} ~ ${formatDate(currentLease.lease_end_date)}，在租期结束前不可重复申请。` : '该房源当前为空闲状态，可直接提交申请。';
        const statusClass = isRented ? 'status-rented' : 'status-available';
        const defaultStart = toDateInputValue(new Date());
        const defaultEnd = addDays(defaultStart, 30);

        content.innerHTML = `
          <div class="panel card-surface">
            <img class="cover" src="${item.house_image || 'https://via.placeholder.com/1200x700?text=House'}" alt="${item.house_title}">
            <div class="body">
              <h1 class="page-title" style="font-size:28px;">${item.house_title}</h1>
              <div class="status-box ${statusClass}">当前状态：<strong>${isRented ? '已出租' : '空闲'}</strong><br>${leaseMsg}</div>
              <div class="meta">地址：${item.house_address}</div>
              <div class="meta">面积：${item.house_area}㎡ ｜ 户型：${item.house_type || '-'} ｜ 楼层：${item.house_floor || '-'}</div>
              <div class="meta">朝向：${item.house_direction || '-'} ｜ 更新时间：${item.updated_at ? formatDate(item.updated_at) : '-'}</div>
              <div class="price">¥${item.house_price}/月</div>
              <div class="desc">${item.house_desc || '暂无描述'}</div>
              ${currentLease ? `<div class="lease-info">当前租赁时间：<strong>${formatDate(currentLease.lease_start_date)} ~ ${formatDate(currentLease.lease_end_date)}</strong></div>` : ''}
            </div>
          </div>
          <div class="panel card-surface">
            <div class="body">
              <h2 style="margin-top:0;">提交租房申请</h2>
              <div class="helper">如果房源已出租，下面会显示当前租期。租赁日期灵活设置，只要开始日期早于结束日期即可。</div>
              <form id="applyForm" class="form">
                <label class="small">开始出租日期</label>
                <input name="lease_start_date" id="leaseStart" type="date" ${canApply ? '' : 'disabled'} />
                <label class="small">结束出租日期</label>
                <input name="lease_end_date" id="leaseEnd" type="date" ${canApply ? '' : 'disabled'} />
                <button class="btn btn-primary" id="applyBtn" type="submit" ${canApply ? '' : 'disabled'}>${canApply ? '提交申请' : '当前房源不可申请'}</button>
              </form>
              <div id="msg" style="margin-top:12px;color:var(--danger);"></div>
            </div>
          </div>`;

        const leaseStart = document.getElementById('leaseStart');
        const leaseEnd = document.getElementById('leaseEnd');
        if (canApply) {
          leaseStart.value = defaultStart;
          leaseEnd.value = defaultEnd;
          leaseStart.min = defaultStart;
          leaseEnd.min = defaultStart;
          leaseStart.addEventListener('change', () => {
            leaseEnd.min = leaseStart.value || defaultStart;
            if (leaseEnd.value && leaseStart.value && leaseEnd.value <= leaseStart.value) leaseEnd.value = addDays(leaseStart.value, 30);
          });
          leaseEnd.addEventListener('change', () => {
            if (leaseStart.value && leaseEnd.value && leaseEnd.value <= leaseStart.value) {
              document.getElementById('msg').textContent = '结束日期必须晚于开始日期';
              leaseEnd.value = addDays(leaseStart.value, 30);
            } else {
              document.getElementById('msg').textContent = '';
            }
          });
        }

        document.getElementById('applyForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          if (!currentUser.id) { document.getElementById('msg').textContent = '请先登录后再提交申请'; return; }
          const formData = Object.fromEntries(new FormData(e.target).entries());
          if (!formData.lease_start_date || !formData.lease_end_date) { document.getElementById('msg').textContent = '请选择完整的租期'; return; }
          if (formData.lease_start_date >= formData.lease_end_date) { document.getElementById('msg').textContent = '结束日期必须晚于开始日期'; return; }
          try {
            const btn = document.getElementById('applyBtn');
            btn.disabled = true;
            btn.textContent = '提交中...';
            const res = await fetch('/api/applications', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ user_id: currentUser.id, house_id: item.id, ...formData })
            });
            const applyResult = await res.json();
            if (applyResult.code !== 200) { document.getElementById('msg').textContent = applyResult.message || '提交失败'; btn.disabled = false; btn.textContent = '提交申请'; return; }
            document.getElementById('msg').style.color = '#16a34a';
            document.getElementById('msg').textContent = applyResult.message || '提交完成';
            setTimeout(() => location.href = '/pages/application/mine.html', 800);
          } catch (error) {
            document.getElementById('msg').textContent = '网络异常，请稍后重试';
            const btn = document.getElementById('applyBtn');
            btn.disabled = false;
            btn.textContent = '提交申请';
          }
        });
      } catch (error) {
        content.innerHTML = '<div class="empty-state">网络异常，请稍后重试</div>';
      }
    }
    loadDetail();
  </script>
</body>
</html>
