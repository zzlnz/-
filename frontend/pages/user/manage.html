<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>用户管理 - 房屋租赁管理系统</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <style>
    .section-card { padding: 22px; }
    .toolbar { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
    .toolbar .input, .toolbar .select { max-width: 240px; }
    .table { width:100%; border-collapse: collapse; }
    .table th, .table td { padding:14px 16px; border-bottom:1px solid var(--border); text-align:left; vertical-align:top; font-size:14px; }
    .table th { background:#f9fafb; }
    .status { display:inline-block; padding:6px 10px; border-radius:999px; font-size:12px; }
    .status-on { background:#dcfce7; color:#166534; }
    .status-off { background:#fee2e2; color:#991b1b; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; }
    .empty { padding:40px; text-align:center; color:var(--muted); }
    .modal-mask { position:fixed; inset:0; background:rgba(15,23,42,.45); display:none; align-items:center; justify-content:center; padding:20px; z-index:999; }
    .modal { width:min(720px, 100%); background:#fff; border-radius:18px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.18); }
    .modal-header,.modal-footer { padding:18px 22px; border-bottom:1px solid var(--border); }
    .modal-footer { border-bottom:none; border-top:1px solid var(--border); display:flex; justify-content:flex-end; gap:10px; }
    .form-grid { padding:22px; display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:16px; }
    .field { display:flex; flex-direction:column; gap:8px; }
    .field.full { grid-column:1/-1; }
    @media (max-width: 900px) { .form-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="app-topbar" id="topbar"></div>
  <div class="page-shell">
    <div class="page-hero">
      <h1 class="page-title">用户管理</h1>
      <p class="page-subtitle">管理员可在这里查看、添加、编辑、删除用户，并调整角色与状态。</p>
    </div>

    <div class="section-card" style="margin-top:20px;">
      <div class="toolbar">
        <input class="input" id="keyword" placeholder="搜索用户名 / 真实姓名 / 手机号" />
        <select class="select" id="roleFilter">
          <option value="">全部角色</option>
          <option value="admin">管理员</option>
          <option value="tenant">租客</option>
        </select>
        <select class="select" id="statusFilter">
          <option value="">全部状态</option>
          <option value="1">启用</option>
          <option value="0">禁用</option>
        </select>
        <button class="btn btn-primary" id="searchBtn">搜索</button>
        <button class="btn btn-soft" id="resetBtn">重置</button>
        <button class="btn btn-primary" id="addBtn">+ 新增用户</button>
      </div>
      <div id="content"></div>
    </div>
  </div>

  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">新增用户</h2>
      </div>
      <form id="userForm">
        <input type="hidden" name="id" />
        <div class="form-grid">
          <div class="field">
            <label>用户名</label>
            <input class="input" name="username" required />
          </div>
          <div class="field">
            <label>密码</label>
            <input class="input" name="password" type="password" placeholder="不填则编辑时不修改密码" />
          </div>
          <div class="field">
            <label>真实姓名</label>
            <input class="input" name="real_name" />
          </div>
          <div class="field">
            <label>手机号</label>
            <input class="input" name="phone" />
          </div>
          <div class="field">
            <label>角色</label>
            <select class="select" name="role">
              <option value="tenant">租客</option>
              <option value="admin">管理员</option>
            </select>
          </div>
          <div class="field">
            <label>状态</label>
            <select class="select" name="status">
              <option value="1">启用</option>
              <option value="0">禁用</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-soft" id="cancelBtn">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/assets/js/nav.js"></script>
  <script>
    const currentUser = AppNav.getUser();
    if (currentUser.role !== 'admin') location.replace('/pages/home/index.html');
    document.getElementById('topbar').innerHTML = AppNav.buildNav('用户管理');

    const content = document.getElementById('content');
    const keywordEl = document.getElementById('keyword');
    const roleFilterEl = document.getElementById('roleFilter');
    const statusFilterEl = document.getElementById('statusFilter');
    const modalMask = document.getElementById('modalMask');
    const modalTitle = document.getElementById('modalTitle');
    const userForm = document.getElementById('userForm');
    let editingId = null;

    function statusBadge(status) {
      return Number(status) === 1 ? '<span class="status status-on">启用</span>' : '<span class="status status-off">禁用</span>';
    }
    function roleText(role) { return role === 'admin' ? '管理员' : '租客'; }

    function openModal(title, data = null) {
      modalTitle.textContent = title;
      modalMask.style.display = 'flex';
      userForm.reset();
      if (data) {
        editingId = data.id;
        userForm.id.value = data.id;
        userForm.username.value = data.username || '';
        userForm.real_name.value = data.real_name || '';
        userForm.phone.value = data.phone || '';
        userForm.role.value = data.role || 'tenant';
        userForm.status.value = String(data.status ?? 1);
        userForm.password.value = '';
      } else {
        editingId = null;
        userForm.status.value = '1';
        userForm.role.value = 'tenant';
      }
    }
    function closeModal() { modalMask.style.display = 'none'; }

    async function loadList() {
      try {
        const res = await fetch('/api/users');
        const result = await res.json();
        if (result.code !== 200) { content.innerHTML = `<div class="empty">${result.message || '加载失败'}</div>`; return; }
        let list = result.data || [];
        const keyword = keywordEl.value.trim().toLowerCase();
        const role = roleFilterEl.value;
        const status = statusFilterEl.value;
        if (keyword) list = list.filter(item => [item.username, item.real_name, item.phone].some(v => String(v || '').toLowerCase().includes(keyword)));
        if (role) list = list.filter(item => item.role === role);
        if (status !== '') list = list.filter(item => String(item.status) === status);
        if (!list.length) { content.innerHTML = '<div class="empty">暂无用户数据</div>'; return; }
        content.innerHTML = `
          <table class="table">
            <thead>
              <tr>
                <th>用户名</th>
                <th>真实姓名</th>
                <th>手机号</th>
                <th>角色</th>
                <th>状态</th>
                <th>更新时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody>
              ${list.map(item => `
                <tr>
                  <td><strong>${item.username || '-'}</strong></td>
                  <td>${item.real_name || '-'}</td>
                  <td>${item.phone || '-'}</td>
                  <td>${roleText(item.role)}</td>
                  <td>${statusBadge(item.status)}</td>
                  <td>${item.updated_at ? String(item.updated_at).replace('T', ' ').slice(0, 19) : '-'}</td>
                  <td>
                    <div class="actions">
                      <button class="btn btn-success" data-action="edit" data-id="${item.id}">编辑</button>
                      <button class="btn btn-danger" data-action="delete" data-id="${item.id}">删除</button>
                    </div>
                  </td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;

        content.querySelectorAll('[data-action="edit"]').forEach(btn => {
          btn.addEventListener('click', () => {
            const data = list.find(i => String(i.id) === String(btn.dataset.id));
            openModal('编辑用户', data);
          });
        });
        content.querySelectorAll('[data-action="delete"]').forEach(btn => {
          btn.addEventListener('click', async () => {
            if (!confirm('确定要删除该用户吗？')) return;
            const res = await fetch(`/api/users/${btn.dataset.id}`, { method: 'DELETE' });
            const result = await res.json();
            alert(result.message || '删除成功');
            loadList();
          });
        });
      } catch (error) {
        content.innerHTML = '<div class="empty">网络异常，请稍后重试</div>';
      }
    }

    document.getElementById('searchBtn').addEventListener('click', loadList);
    document.getElementById('resetBtn').addEventListener('click', () => { keywordEl.value = ''; roleFilterEl.value = ''; statusFilterEl.value = ''; loadList(); });
    document.getElementById('addBtn').addEventListener('click', () => openModal('新增用户'));
    document.getElementById('cancelBtn').addEventListener('click', closeModal);
    modalMask.addEventListener('click', (e) => { if (e.target === modalMask) closeModal(); });

    userForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(userForm).entries());
      if (!data.password) delete data.password;
      const method = editingId ? 'PUT' : 'POST';
      const url = editingId ? `/api/users/${editingId}` : '/api/users';
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const result = await res.json();
      alert(result.message || '保存成功');
      if (result.code === 200) {
        closeModal();
        loadList();
      }
    });

    loadList();
  </script>
</body>
</html>
