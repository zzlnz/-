<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人中心 - 房屋租赁管理系统</title>
  <link rel="stylesheet" href="/assets/css/theme.css" />
  <style>
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:20px; }
    .card { padding: 22px; }
    .item { padding:12px 0; border-bottom:1px solid var(--border); }
    .item:last-child { border-bottom:none; }
    .label { color:var(--muted); font-size:14px; margin-bottom:6px; }
    .value { font-size:16px; }
    .quick-links { display:grid; grid-template-columns: 1fr; gap:10px; }
    .quick-links a { padding:12px 14px; border:1px solid var(--border); border-radius:12px; background:#fff; }
    @media (max-width: 900px) { .grid { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="app-topbar" id="topbar"></div>
  <div class="page-shell">
    <div class="page-hero">
      <h1 class="page-title">个人中心</h1>
      <p class="page-subtitle">查看当前账号信息，并进入和你角色相关的常用功能。</p>
    </div>
    <div class="grid" style="margin-top:20px;">
      <div class="section-card card">
        <h2>个人信息</h2>
        <div id="userBox"></div>
      </div>
      <div class="section-card card">
        <h2>快捷入口</h2>
        <div class="quick-links" id="quickLinks"></div>
      </div>
    </div>
  </div>
  <script src="/assets/js/nav.js"></script>
  <script>
    const user = AppNav.getUser();
    const userBox = document.getElementById('userBox');
    const quickLinksEl = document.getElementById('quickLinks');
    document.getElementById('topbar').innerHTML = AppNav.buildNav('个人中心');

    const links = user.role === 'admin'
      ? [
          { href:'/pages/house/manage.html', label:'房源管理', desc:'管理房源新增、编辑、删除和状态修改。' },
          { href:'/pages/application/manage.html', label:'申请管理', desc:'审核租客的申请并生成租赁记录。' },
          { href:'/pages/lease/records.html', label:'租赁记录', desc:'查看所有租赁记录和租期信息。' },
          { href:'/pages/user/manage.html', label:'用户管理', desc:'管理员新增、编辑、删除用户账号。' }
        ]
      : [
          { href:'/pages/application/mine.html', label:'我的申请', desc:'查看你的申请详情、状态与租赁日期。' },
          { href:'/pages/home/index.html', label:'浏览房源', desc:'返回首页继续寻找心仪房源。' }
        ];
    quickLinksEl.innerHTML = links.map(item => `<a href="${item.href}"><strong>${item.label}</strong><div style="color:var(--muted);font-size:14px;line-height:1.6;">${item.desc}</div></a>`).join('');

    if (!user.id) {
      userBox.innerHTML = '<div class="empty-state">请先登录后查看个人中心</div>';
    } else {
      userBox.innerHTML = `
        <div class="item"><div class="label">用户名</div><div class="value">${user.username || '-'}</div></div>
        <div class="item"><div class="label">真实姓名</div><div class="value">${user.real_name || '-'}</div></div>
        <div class="item"><div class="label">手机号</div><div class="value">${user.phone || '-'}</div></div>
        <div class="item"><div class="label">角色</div><div class="value">${user.role === 'admin' ? '管理员' : '租客'}</div></div>
      `;
    }

    document.getElementById('logoutLink').addEventListener('click', () => { localStorage.removeItem('token'); localStorage.removeItem('user'); });
  </script>
</body>
</html>
